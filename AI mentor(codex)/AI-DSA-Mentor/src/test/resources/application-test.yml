spring:
  datasource:
    url: jdbc:h2:mem:ai_dsa_mentor_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

application:
  security:
    jwt:
      secret-key: test-secret-key-with-at-least-thirty-two-characters
      expiration-ms: 3600000
      refresh-expiration-ms: 604800000
